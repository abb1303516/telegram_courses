# /etc/nginx/sites-available/telegram-courses
# Current production host. Replace the IP and certificate path after a move.

server {
    listen 80;
    listen [::]:80;
    server_name 173.249.194.240;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 173.249.194.240;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/173.249.194.240/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/173.249.194.240/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    client_max_body_size 256k;

    location / {
        proxy_pass http://127.0.0.1:8181;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Do not duplicate large downloads in nginx's temporary storage.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
